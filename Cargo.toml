[workspace]
resolver = "3"
members  = [
    "crates/cargo-cgp",
    "crates/cargo-cgp-driver",
    "crates/cargo-cgp-error-processing",
    "crates/cargo-cgp-ui-tests",
]
# The UI snapshot harness lives in its own crate (`cargo-cgp-ui-tests`), a full workspace
# member, so `cargo test` runs the whole suite alongside the unit tests. The fixtures it
# drives are loose `.rs` files under `tests/ui/`, not a cargo package. Running the suite
# builds the driver, expects a sibling `cgp` checkout at `../cgp`, and uses the pinned
# toolchain.

# Versions are kept in lockstep at the workspace level, mirroring the cgp
# workspace: shared package metadata lives in `[workspace.package]` and each
# crate references it with `{ workspace = true }`.
[workspace.package]
version      = "0.1.0-alpha"
edition      = "2024"
rust-version = "1.96"
license      = "MIT"
repository   = "https://github.com/contextgeneric/cargo-cgp"
authors      = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords     = ["cgp"]

[workspace.dependencies]
anyhow = { version = "1" }
# Semantic-version parsing/comparison, used by `cargo cgp update` to decide whether the
# latest published version is newer than the running one, and to keep updates on the same
# pre-release channel.
semver = { version = "1" }
# Blocking HTTP client, used by `cargo cgp update` to read the crates.io sparse index (all
# published versions) so it can pick the highest version in the running crate's channel.
# rustls TLS keeps it self-contained. Only the front-end's `update` path links it — the
# check path and the driver do not. (ureq is a widely used, dependency-light client.)
ureq = { version = "3" }
# JSON parsing of the sparse-index lines. Ubiquitous and dependency-light.
serde_json = { version = "1" }
# The rustc-free error-processing library the driver drives. An ordinary crate that does
# not touch `rustc_private`, so it builds and its tests run on any toolchain.
cargo-cgp-error-processing = { path = "crates/cargo-cgp-error-processing" }
# Renders the transitive dependency chain of a resolved check failure as a `cargo tree`-style
# tree in the replacement diagnostic. Tiny and dependency-free, so it does not weigh down the
# rustc-free error-processing crate that hosts the pure renderer.
termtree = { version = "1" }
