[workspace]
resolver = "3"
members  = [
    "crates/cargo-cgp",
    "crates/cargo-cgp-driver",
    "crates/cargo-cgp-error-processing",
    "crates/cargo-cgp-ui-tests",
]
# The UI snapshot harness lives in its own crate (`cargo-cgp-ui-tests`), a full workspace
# member, so `cargo test` runs the whole suite alongside the unit tests. The fixtures it
# drives are loose `.rs` files under `tests/ui/`, not a cargo package. Running the suite
# builds the driver, expects a sibling `cgp` checkout at `../cgp`, and uses the pinned
# toolchain.

# Versions are kept in lockstep at the workspace level, mirroring the cgp
# workspace: shared package metadata lives in `[workspace.package]` and each
# crate references it with `{ workspace = true }`.
[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"
license      = "MIT"
repository   = "https://github.com/contextgeneric/cargo-cgp"
authors      = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords     = ["cgp"]

[workspace.dependencies]
anyhow = { version = "1" }
# The rustc-free error-processing library and the diagnostic types it works over. Both
# are ordinary crates that do not touch `rustc_private`, so the front-end can depend on
# them without dragging in the compiler.
cargo-cgp-error-processing = { path = "crates/cargo-cgp-error-processing" }
cargo_metadata = { version = "0.23" }
# Renders the transitive dependency chain of a resolved check failure as a `cargo tree`-style
# tree in the replacement diagnostic. Tiny and dependency-free, so it does not weigh down the
# rustc-free error-processing crate that hosts the pure renderer.
termtree = { version = "1" }
# The front-end as a library, so the UI-test harness can reuse its own capture and render
# functions (parsing cargo's JSON, formatting diagnostics) — the same code the tool runs.
cargo-cgp = { path = "crates/cargo-cgp" }
serde_json = { version = "1" }
