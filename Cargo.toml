[workspace]
resolver = "3"
members  = [
    "crates/cargo-cgp",
    "crates/cargo-cgp-driver",
]
# The UI fixtures under `tests/ui/` are loose `.rs` files, not a cargo package, so
# nothing there is part of this workspace or the root build. The snapshot harness
# (scripts/ui-test.sh) compiles each one through cargo-cgp in a throwaway crate.

# Versions are kept in lockstep at the workspace level, mirroring the cgp
# workspace: shared package metadata lives in `[workspace.package]` and each
# crate references it with `{ workspace = true }`.
[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"
license      = "MIT"
repository   = "https://github.com/contextgeneric/cargo-cgp"
authors      = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords     = ["cgp"]

[workspace.dependencies]
anyhow = { version = "1" }
