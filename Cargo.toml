[workspace]
resolver = "3"
members  = [
    "crates/cargo-cgp",
    "crates/cargo-cgp-driver",
]
# The example fixtures under `tests/` are a standalone package, deliberately kept
# out of the workspace: many of them are CGP mistakes that fail to compile on
# purpose, and a workspace member would break `cargo build`/`cargo clippy` at the
# root. It is only ever compiled through cargo-cgp (see scripts/run-check.sh).
exclude = ["tests"]

# Versions are kept in lockstep at the workspace level, mirroring the cgp
# workspace: shared package metadata lives in `[workspace.package]` and each
# crate references it with `{ workspace = true }`.
[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"
license      = "MIT"
repository   = "https://github.com/contextgeneric/cargo-cgp"
authors      = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords     = ["cgp"]

[workspace.dependencies]
anyhow = { version = "1" }
