[package]
name         = "cargo-cgp-driver"
description  = "A rustc wrapper, built on rustc_driver, that cargo-cgp invokes to compile workspace crates."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
keywords     = { workspace = true }

# The rustc wrapper. It links the compiler-internal `rustc_driver`/`rustc_interface`
# crates from the sysroot via the `rustc_private` feature (see `src/lib.rs`), so it can
# only be built with a nightly toolchain carrying the `rustc-dev` component — hence the
# workspace `rust-toolchain.toml`. The compiler crates are pulled from the sysroot by
# `extern crate`, not `[dependencies]`.
[[bin]]
name = "cargo-cgp-driver"
path = "bin/cargo-cgp-driver.rs"

# The one ordinary dependency: the rustc-free error-processing crate, for the compiler-free
# message-rewrite logic (`rewrite`) and the `ComponentNameMap` the driver fills in from the
# compiler. Keeping that logic there lets it be unit-tested without the driver's nightly
# `rustc_private` linkage.
[dependencies]
cargo-cgp-error-processing = { workspace = true }
# The rustc-free resugaring the expand mode drives: the driver prints the expanded crate with the
# compiler's own printer and hands the text here to have its CGP constructs folded back to the
# surface macros. Kept out of this crate for the same reason as the error processing — so it builds
# and its tests run without the `rustc_private` linkage.
cargo-cgp-expand = { workspace = true }
