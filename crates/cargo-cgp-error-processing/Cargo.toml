[package]
name         = "cargo-cgp-error-processing"
description  = "Compiler-free string transforms that make CGP diagnostics readable, driven by the cargo-cgp driver."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
keywords     = { workspace = true }

# This crate holds the string-level diagnostic logic the driver drives — the wiring-message
# rewrite, the fallback post-processing transforms, and the dependency-tree renderer. It
# deliberately does *not* depend on `rustc_private`: it operates on plain text and typed
# tree data the driver hands it, so it builds and its tests run on any toolchain, without
# the driver's compiler linkage. See `cgp-knowledge-base/cargo-cgp/implementation/error-processing.md`.

# The dependency-graph rendering tests pin each rendered tree as an inline snapshot with `insta`.
[dev-dependencies]
insta = { workspace = true }

[dependencies]
# Renders the dependency tree of a resolved check failure. The driver builds the tree data
# from typed compiler state and this crate turns it into `cargo tree`-style text, kept here so
# the rendering is unit-tested without the driver's `rustc_private` linkage.
termtree = { workspace = true }
