# Auxiliary crate for the UI suite: a context and its handler wiring defined upstream
# of the fixture that runs it. The harness copies this directory under
# `target/ui-harness/aux/` and replaces `__CGP_CRATE_DIR__` with the resolved path of
# the sibling `cgp` checkout. The empty `[workspace]` table detaches it from the
# cargo-cgp workspace above `target/`.
[package]
name    = "cgp-test-foreign-pipeline"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cgp = { path = "__CGP_CRATE_DIR__" }

[workspace]
