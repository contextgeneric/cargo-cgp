[package]
name         = "cargo-cgp"
description  = "A cargo subcommand that makes Context-Generic Programming errors readable, leading with the root cause, and expands CGP macros readably."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
readme       = "../../README.md"

# The cargo-subcommand front-end: an ordinary binary that links no compiler crate and
# does *not* depend on `rustc_private`. It launches cargo with the driver wired in as the
# rustc wrapper and lets cargo's output stream through untouched, since the driver does
# every diagnostic transform in-process. Keeping the compiler-internal
# linkage out of this crate keeps the front-end small and buildable without loading LLVM.
[[bin]]
name = "cargo-cgp"
path = "bin/cargo-cgp.rs"

[dependencies]
anyhow = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
