[package]
name         = "cargo-cgp-tests"
description  = "Example CGP source files to run cargo-cgp against during development."
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"
license      = "MIT"
publish      = false

# Every example under `examples/` shares this one manifest — cargo auto-discovers
# `examples/*.rs` as example targets, so a new fixture needs no `Cargo.toml` and no
# entry here. Check one with `cargo check --example <name>`, or use the helper
# `scripts/run-check.sh <name>` to run it through cargo-cgp.
#
# This package is excluded from the workspace (see ../Cargo.toml); the cgp
# dependency is a path into the sibling `cgp` checkout, which is assumed to live at
# `../../cgp` relative to this repository.
[dependencies]
cgp = { path = "../../cgp/crates/main/cgp" }
